<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" href="width=device-width, initial-scale=1.0" />
    <title>Zacarias' Russian Tank Hero</title>
    <link rel="icon" type="image/png" href="./assets/images/russian_flag.png">
  </head>
  <body>

      <h1>Rotating Cube</h1>
      <span class="hint">Press <kbd>Space</kbd> to change color, <kbd>R</kbd> to toggle rotation</span>

    <main>
      <div id="div-controls">
        <span class="hint"> 
          <span class="group-keys"><div style="display: flex;"><kbd>←</kbd><kbd>→</kbd></div></span> move 
            <span class="group-keys"><div style="display: flex;"><kbd>↑</kbd><kbd>↓</kbd></div></span> angle

            <span class="group-keys"><div style="display:flex"><kbd>Space</kbd></div></span> fire 
            <span class="group-keys"><div style="display:flex"><kbd>R</kbd></div></span> reset 
            <span class="group-keys"><div style="display:flex"><kbd>C</kbd></div></span> camera
            <span class="group-keys"><div style="display:flex"><kbd>M</kbd></div></span> toggle music 
          </span>
      </div>
      <div id="stage"></div>
    </main>
    <script type="module" src="/src/main.ts">
    </script>
